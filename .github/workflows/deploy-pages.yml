name: Deploy (develop) to GitHub Pages

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-develop"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --dart-define=DEMO=true \
            --base-href "/${{ github.event.repository.name }}/"

      - name: Replace API keys for production
        run: |
          sed -i 's/PRODUCTION_API_KEY_HERE/${{ secrets.GOOGLE_MAPS_API_KEY }}/g' build/web/index.html

      - name: SPA 404 fallback
        run: cp build/web/index.html build/web/404.html || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
