name: Firebase Hosting Preview (hackathon-2025)

on:
  push:
    branches: [ hackathon-2025 ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase Tools
        run: npm i -g firebase-tools

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build Flutter Web
        run: |
          flutter --version
          flutter pub get
          flutter build web --release -t lib/hackathon/main_hackathon.dart

      - name: Inject Google Maps API key
        run: sed -i 's/<meta name="google_maps_api_key" content="MAPS_API_KEY">/<meta name="google_maps_api_key" content="${{ secrets.HACKATHON_MAPS_API_KEY }}">/g' build/web/index.html


      - name: Deploy to Firebase Hosting (preview channel)
        run: |
          firebase hosting:channel:deploy hackathon-2025 \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --token ${{ secrets.FIREBASE_TOKEN }} \
            --non-interactive


