name: niigata_flower_guide
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  flutter_dotenv: ^5.1.0
  webview_flutter: ^4.10.0
  google_maps_flutter: ^2.8.0
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  provider: ^6.1.2
  geolocator: ^13.0.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.4.3
  flutter_unity_widget: ^2022.2.1
  expandable_text: ^2.3.0
  url_launcher: ^6.3.1
  url_launcher: ^6.2.2
  share_plus: ^11.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/flower_field.png
    - assets/images/map_icon.png
    - assets/images/collection_icon.png
    - assets/images/profile_icon.png
    - assets/images/ar_camera_icon.png
    - assets/images/tulip_field.jpg
    - assets/images/laporteshoukai.jpg
    - assets/images/backgroundflower.png
    - assets/images/cherryblossom.png
    - assets/images/cherryblossom2.png
    - assets/images/cosmos.png
    - assets/images/daylily.png
    - assets/images/hydrangea.png
    - assets/images/question.png
    - assets/images/tulip.png
    - assets/images/lotus.png
    - assets/images/rapeblossoms.png
    - assets/images/cherry_rapeblossoms.png
    - assets/photos/
    - assets/.env
